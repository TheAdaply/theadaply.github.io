name: Sync sitemap

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-sitemap
  cancel-in-progress: false

jobs:
  sync-sitemap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate sitemap.xml when lastmods drift
        run: python3 scripts/generate_sitemap.py

      - name: Commit sitemap.xml if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml already matches routes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: regenerate sitemap.xml"
          git pull --rebase origin main
          git push origin main